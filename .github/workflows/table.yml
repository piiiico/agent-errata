name: update-readme-table
on:
  push:
    branches: [main]
    paths: ["entries/**", "replications/**", "claims/**", "scripts/validate.ts", ".github/workflows/table.yml"]
permissions:
  contents: write
jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # validate.ts resolves links to this repo's commits
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/validate.ts --write-readme
      - run: |
          if ! git diff --quiet README.md; then
            git config user.name "agent-errata-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update entry table"
            git push
          fi
