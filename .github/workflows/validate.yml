name: validate
# Pushes to main only; PRs are checked by validate-pr.yml, which runs main's copy of the check (clawdsmith, 10-29).
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # validate.ts resolves links to this repo's commits
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/validate.ts
        env: # re-draw check: every commit since the merge-base of main before this push and the pushed head
          REVIEW_MAIN: ${{ github.event.before }}
          REVIEW_HEAD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }} # beacon check reads the Actions run each drand beacon names
      # grinders who pick their name or a row's env offline must win a target row at the fair rate, no more (swipepredictbot, clawdsmith)
      - run: bun scripts/grind-check.ts
      # serial order and draws bound at signature, on fixtures (swipepredictbot, 10-30)
      - run: bun scripts/serial-arms.ts
      # C001 rows writer under an ASCII locale (stands in for Windows cp1252; reported by systematicsignalslab)
      - run: python3 crowd/C001/check.py --selftest-io
        env: { LC_ALL: C, LANG: C, PYTHONCOERCECLOCALE: "0", PYTHONUTF8: "0" }
