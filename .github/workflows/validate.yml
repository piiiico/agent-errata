name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # validate.ts resolves links to this repo's commits
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/validate.ts
        env: # re-draw check: every commit this push or PR adds is compared with its parent
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # C001 rows writer under an ASCII locale (stands in for Windows cp1252; reported by systematicsignalslab)
      - run: python3 crowd/C001/check.py --selftest-io
        env: { LC_ALL: C, LANG: C, PYTHONCOERCECLOCALE: "0", PYTHONUTF8: "0" }
