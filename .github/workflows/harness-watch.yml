name: harness-watch
# S003/S004 Harness Watch: every day, check the 10 harnesses for a new release; re-run the canary arms a-f and
# the S004 token split on each new version, commit the row and the page changelogs, open an issue if a row changed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "harness ids to re-measure even at the same version, comma-separated (positive control)"
        required: false
        default: ""
      selftest:
        description: "plant a change in a scratch copy of pi's baseline row and check that it is detected and reported (opens and closes one [selftest] issue; commits nothing)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: harness-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q tiktoken
      - id: watch
        if: ${{ !inputs.selftest }}
        env:
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ -n "$FORCE" ]; then bun studies/S003/watch/watch.ts --force "$FORCE"; else bun studies/S003/watch/watch.ts; fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: commit rows and changelogs
        if: always() && !inputs.selftest
        run: |
          git add studies/S003/watch docs/S003 docs/S004
          if ! git diff --cached --quiet; then
            git config user.name "agent-errata-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Harness Watch $(date -u +%F): $(bun -e 'const r=require("/tmp/hw/report.json");console.log(r.measured+" re-measured, "+r.changed.length+" changed")')"
            git pull --rebase
            git push
          fi
      - name: open an issue for each changed row
        if: always() && !inputs.selftest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/hw/report.json ] || exit 0
          bun studies/S003/watch/issue.ts /tmp/hw/report.json
      - name: selftest (planted change must be detected and reported)
        if: inputs.selftest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp -r "$PWD" /tmp/selftest && cd /tmp/selftest
          bun -e 'const f="studies/S003/watch/state.json",fs=require("fs"),s=JSON.parse(fs.readFileSync(f,"utf8"));s.harnesses.pi.row.arms.b=["S003C-B-CLAUDEMD"];fs.writeFileSync(f,JSON.stringify(s))'
          HW_WORK=/tmp/hw-self bun studies/S003/watch/watch.ts --only pi --force pi
          bun studies/S003/watch/issue.ts /tmp/hw-self/report.json --selftest
      - name: fail if any lookup or re-measure failed
        if: always() && !inputs.selftest
        run: exit ${{ steps.watch.outputs.rc || 1 }}
